name: Capture Slack ideas/bugs

on:
  schedule:
    # 04:47 UTC daily. Off the top of the hour to dodge the worst cron queueing;
    # expect GitHub to run it anywhere up to a few hours late regardless.
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads Slack and reports only; live files tickets"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run
      since_hours:
        description: "Look-back window in hours. Empty = value from the config file."
        type: string
        default: ""

# Dedup has two markers (a Jira label set at creation and a Slack reply posted
# after), but two runs in flight at the same time could still both see "not
# filed" in the gap between them. Queue runs instead of cancelling: cancelling
# a run between creating the issue and posting the reply is exactly how two
# ideas were double-filed in an earlier version.
concurrency:
  group: capture-ideas
  cancel-in-progress: false

jobs:
  capture:
    # The public repository holds the code only. Set CAPTURE_ENABLED=true as a
    # repository variable in the private deployment that owns the secrets.
    if: ${{ vars.CAPTURE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Write config from repository variable
        env:
          CAPTURE_CONFIG_JSON: ${{ vars.CAPTURE_CONFIG_JSON }}
        run: |
          if [ -z "$CAPTURE_CONFIG_JSON" ]; then
            echo "::error::Repository variable CAPTURE_CONFIG_JSON is not set"; exit 1
          fi
          printf '%s' "$CAPTURE_CONFIG_JSON" > capture.config.json

      - name: Capture
        env:
          # Scheduled runs are always live; manual runs default to dry-run.
          CAPTURE_DRY_RUN: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'live') && '0' || '1' }}
          CAPTURE_SINCE_HOURS: ${{ github.event.inputs.since_hours }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: npm run capture
