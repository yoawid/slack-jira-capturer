name: Capture Slack ideas/bugs

on:
  schedule:
    # 04:47 UTC daily ≈ 05:47 (winter) / 06:47 (summer) Stockholm.
    # Off the top-of-hour to reduce GitHub Actions cron queue delays.
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads Slack and reports only; live files tickets"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run
      since_hours:
        description: "How far back to look, in hours (168 = 7 days)"
        type: string
        default: "168"

# Dedup works by checking Slack for this bot's confirmation reply, which is
# only posted after the ticket exists. Two overlapping runs therefore both see
# "not yet filed" and file the same message twice — this happened on
# 2026-08-13, producing MPR-468/469 and duplicates MPR-470/471 seven seconds
# apart. Queue runs instead of cancelling: cancelling mid-flight could kill a
# run between creating the issue and posting the reply, which would leave a
# ticket dedup can never see.
concurrency:
  group: capture-ideas
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run capture:agent
        env:
          # Claude subscription auth. ANTHROPIC_API_KEY is deliberately NOT set:
          # in headless mode it overrides this token and bills API credits.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Scheduled runs are always live; manual runs default to dry-run.
          CAPTURE_DRY_RUN: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'live') && '0' || '1' }}
          # Scheduled runs use the code default (168h); manual runs may widen it.
          CAPTURE_SINCE_HOURS: ${{ github.event.inputs.since_hours }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
